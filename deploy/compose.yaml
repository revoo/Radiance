# Radiance on the server (ADR 0018). Lives at /opt/hosting/radiance/compose.yaml. It's its own Compose
# project, so updating it touches nothing else, and it joins the hosting project's network: the shared Caddy
# reaches it as radiance:8080, and it publishes no ports. See docs/ops/hosting.md.
name: radiance

services:
  radiance:
    image: ghcr.io/revoo/radiance:${RADIANCE_TAG:-main}
    restart: unless-stopped
    user: "${RADIANCE_UID:-1001}:${RADIANCE_GID:-1001}" # owns ./data on the host
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # the box hosts other projects: a fixed heap, and a clean restart rather than limping on after an OOM
      JAVA_TOOL_OPTIONS: "-Xmx768m -XX:+ExitOnOutOfMemoryError"
    volumes:
      - ./data:/app/data
    mem_limit: 1200m
    stop_grace_period: 40s # time to finish a write and release the writer lease
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: hosting_default
    external: true
