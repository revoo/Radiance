spring:
  application:
    name: radiance
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

radiance:
  security:
    username: ${RADIANCE_USERNAME:}
    password-bcrypt: ${RADIANCE_PASSWORD_BCRYPT:}
    dev-login: false
  world:
    timezone: America/Chicago
    home-metro: "Chicago, IL"
    network-name: Radiance
    roster: content/cast/roster.yaml
