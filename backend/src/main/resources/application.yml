spring:
  application:
    name: radiance
  config:
    # Secrets from a git-ignored .env at the repo root (bootRun runs in backend/) or the working dir.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

radiance:
  security:
    username: ${RADIANCE_USERNAME:}
    password-bcrypt: ${RADIANCE_PASSWORD_BCRYPT:}
    dev-login: false
  persistence:
    db-path: data/radiance.db
    read-pool-size: 4
    lease-ttl: 30s                     # a crashed writer blocks others for at most this long
    lease-renew-interval: 10s
  world:
    name: Chicagoland
    timezone: America/Chicago
    home-metro: "Chicago, IL"
    network-name: Radiance
    roster: content/cast/roster.yaml
    seed: 42                           # placeholder world row only; genesis picks the real seed
  batch:
    enabled: true                      # in-process scheduling; one-shot runs use ./gradlew batch
    crons: ["0 9 * * *", "0 11 * * *"] # UTC; with the default time zone, 3–4 am and 5–6 am. The second run finishes or no-ops
    script-slack: 6h                   # each script runs this far past the next batch, in case one fails
    idle-reduced-after: 7d             # idle decay (§5.1)
    idle-summary-after: 21d
    pause-rendering-after: 60d
    prime-time-boost: 1.5              # extra resident activity in your usual online hours
    genesis-history: 14d               # genesis backfills this much history before the first script (§6.4)
  backfill:
    full-window: 48h
    reduced-window: 7d
    max-gap: 30d
  storyteller:                         # live-tunable
    profile: STEADY                    # STEADY | CHAOTIC | COZY
    drama-intensity: 1.0
    max-major-events-per-actor-per-14d: 2
    max-drama-per-day: 2
    event-mix: { DAILY: 0.25, NEWS: 0.25, LIFE: 0.15, HOBBY: 0.12, FAMILY: 0.12, SOCIAL: 0.08, DRAMA: 0.03 }
  social:                              # live-tunable
    user-salience: 2.0
    max-user-share-of-attention: 0.5
    content-kind-weights: { PHOTO: 1.3, TEXT: 1.0, LINK: 0.7, COMMENT: 0.45, REPLY: 0.3 }
    impression-sensitivity: 1.0
    crush-propensity: 1.0
    dm-initiation-rate: 1.0
    affinity-half-life: 21d
  romance:                             # live-tunable
    temptation: 1.0
    affairs: true
  drift:
    mood-half-life: 36h
    trait-half-life: 60d
    max-trait-drift: 10
  news:
    headlines-per-sim-day: 25
    region-mix: { NATIONAL: 0.60, WORLD: 0.30, LOCAL: 0.10 }   # share of news takes by region; live-tunable
  content:
    edge: 1.0                          # mockery, hostility and prejudice: 0 = wholesome, 1 = a real community, 2 = the worst comment section (§5.8)
    strong-prejudice: 4                # residents with real prejudice (§5.2); applies at genesis
    softening-check: true              # judge MOCK/HOSTILE/TROLL output for softening (§5.10)
    sensitive-arcs: true               # heavy real-life arcs, such as grief over an off-network relative
    arc-blacklist:                     # live-tunable; arcs that never happen, and whose themes stay out of prose (§5.5)
      - id: pregnancy
        theme-terms: [pregnant, pregnancy, "expecting a baby", "baby bump", trimester, "baby shower", "gender reveal"]
  llm:                                 # SPEC §9. The offline and test profiles set mode: fake.
    mode: live                         # live: real providers whose keys are present; fake: FakeLlm everywhere
    providers:                         # one entry per endpoint; keys come from env or .env
      anthropic:  { kind: anthropic, api-key: "${ANTHROPIC_API_KEY:}", max-concurrency: 6 }
      openai:     { kind: openai-compatible, base-url: "https://api.openai.com/v1", api-key: "${OPENAI_API_KEY:}", max-concurrency: 6, max-tokens-field: max_completion_tokens }
      gemini:     { kind: openai-compatible, base-url: "https://generativelanguage.googleapis.com/v1beta/openai/", api-key: "${GEMINI_API_KEY:}", max-concurrency: 4 }
      workers-ai: { kind: openai-compatible, base-url: "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID:}/ai/v1", api-key: "${CF_AI_API_TOKEN:}", max-concurrency: 4 }
      ollama:     { kind: openai-compatible, base-url: "http://localhost:11434/v1", max-concurrency: 1 }   # local models for dev; needs no key
      # A plan with limits gets quota windows, e.g. quotas: [{ requests: 1500, per: day, resets-at: "00:00", zone: America/Los_Angeles }]
      # or [{ tokens: 250000, per: minute }]. Copy them from your plan; free tiers usually have them.
    models:                            # aliases; prices in USD per million tokens, update when they change
      haiku:
        provider: anthropic
        id: claude-haiku-5-5
        capabilities: { structured-output: SCHEMA, vision: true, prompt-caching: EXPLICIT, max-context: 100000 }   # under Haiku 5.5's 100k price step
        params: { effort: low, thinking: disabled }        # Haiku 5.5 thinks by default otherwise
        pricing: { input: 0.10, cached-input: 0.01, cache-write: 0.125, output: 0.50 }
      sonnet:
        provider: anthropic
        id: claude-sonnet-5-5
        capabilities: { structured-output: SCHEMA, vision: true, prompt-caching: EXPLICIT, max-context: 100000 }
        params: { effort: medium, thinking: between_tools } # Sonnet 5.5's lowest thinking setting
        pricing: { input: 2.00, cached-input: 0.10, cache-write: 2.50, output: 10.00 }
      # Bake-off candidates (Appendix C). Verify capabilities with ./gradlew :backend:liveTest before routing to them.
      # luna:
      #   provider: openai
      #   id: gpt-6-luna
      #   capabilities: { structured-output: SCHEMA, vision: true, prompt-caching: AUTOMATIC, max-context: 100000 }
      #   params: { reasoning_effort: none }               # reasons at medium by default
      #   pricing: { input: 0.10, cached-input: 0.01, cache-write: 0.125, output: 0.50 }
      # flash-lite:
      #   provider: gemini
      #   id: gemini-3.1-flash-lite
      #   capabilities: { structured-output: SCHEMA, vision: true, prompt-caching: AUTOMATIC, max-context: 100000 }
      #   params: { reasoning_effort: low }                # Gemini 3 models can't turn reasoning off
      #   pricing: { input: 0.25, cached-input: 0.025, output: 1.50 }
      # llama-8b:
      #   provider: workers-ai
      #   id: "@cf/meta/llama-3.1-8b-instruct"
      #   capabilities: { structured-output: JSON, vision: false, prompt-caching: NONE, max-context: 8000 }
      #   pricing: { input: 0.282, output: 0.827 }         # billed once the free daily neurons run out
      # local-dev: { provider: ollama, id: "<a model you've pulled>", capabilities: { structured-output: JSON }, pricing: { input: 0, output: 0 } }
    routes:                            # purpose → model alias + fallbacks; live-tunable (M13)
      render-thread:     { model: haiku }
      render-dm:         { model: haiku }
      live-comment:      { model: haiku }
      appraisal:         { model: haiku }
      vision-appraisal:  { model: haiku }
      headline-classify: { model: haiku }
      linter-judge:      { model: haiku }
      compaction:        { model: haiku }
      summary:           { model: haiku }
      recap:             { model: haiku }               # decision 18: Haiku everywhere in V1; sonnet stays defined for the V2 bake-off
      genesis:           { model: haiku }
    max-prompt-tokens: 24000           # hard cap; a route's smallest max-context applies too
    budgets: { daily-usd: 1.00, per-batch-usd: 0.30, monthly-usd: 10.00 }   # daily resets at midnight Central, monthly on the 1st
    store-prompts: true                # feeds the prompt inspector and the bake-off
    prompt-store-dir: data/prompts
    recordings: { mode: "OFF", dir: data/llm-recordings }   # OFF | RECORD | REPLAY
