# NEWS (SPEC §5.4, §5.12, A.5): takes on headlines. Stance is computed from politics axes, not generated.
- id: headline_take
  category: NEWS
  trigger: { headline: { min_interest: 0.4 } }
  base_rate: 0.6                          # per interested resident per selected headline
  modifiers: { politics_interest: 1.5, attention_seeking: 1.2, quirk.lurker: 0.1 }
  importance: 3
  tags: [ news ]
  output:
    post: LINK
    stance_from: politics_axes
    brief: "react to the headline from your own perspective, in your own words; don't summarize it"
  effects: { tension: 1 }

- id: headline_rant
  category: NEWS
  trigger: { headline: { min_interest: 0.65 } }
  base_rate: 0.25
  modifiers: { argumentativeness: 2.0, politics_interest: 2.0, quirk.debate_lover: 2.0, quirk.doomscroller: 1.5 }
  importance: 4
  tags: [ news ]
  output:
    post: LINK
    stance_from: politics_axes
    brief: "a heated take that invites an argument; contempt for the other side is fine if it's in character"
  effects: { tension: 2 }

- id: headline_quiet_share
  category: NEWS
  trigger: { headline: { min_interest: 0.3 } }
  base_rate: 0.3
  modifiers: { sincerity: 1.3, argumentativeness: 0.6 }
  importance: 2
  tags: [ news ]
  output:
    post: LINK
    stance_from: politics_axes
    brief: "share the link with a one-liner: 'wow', 'about time', 'of course', or a single emoji"
